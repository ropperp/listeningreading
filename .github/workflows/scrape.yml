name: scrape
on:
  push:
    paths: [".github/workflows/scrape.yml", "scripts/scrape.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scrape.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/raw
          git commit -m "Scraped raw tasks from aufgabenpool" || echo nothing
          git push
