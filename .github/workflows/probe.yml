name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/probe
          curl -sS -m 60 -X POST https://aufgabenpool.at/srdp_lfs/php/results.php -H "X-Requested-With: XMLHttpRequest" \
            --data "getData=1&start=0&limit=50&aname_send=-1&coll_send=-1&coll=&gate=en&level=B2&typ=5&format=0&gers=1&spalte=sortById&asc=0" -o data/probe/le0.html
          curl -sS -m 60 -X POST https://aufgabenpool.at/srdp_lfs/php/results.php -H "X-Requested-With: XMLHttpRequest" \
            --data "getData=1&start=1000&limit=50&aname_send=-1&coll_send=-1&coll=&gate=en&level=B2&typ=5&format=0&gers=1&spalte=sortById&asc=0" -o data/probe/le1000.html
          ls -la data/probe
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/probe; git commit -m "probe results" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
