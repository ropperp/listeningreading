<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matura Lösungen – Reading &amp; Listening B2</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2457d6; --accent-soft: #e8eefc; --ok: #13795b; --ok-soft: #e3f4ec; --bad: #b42318; --bad-soft: #fdecea; --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --fg: #e8eaed; --muted: #9aa3ad; --line: #2b323a;
            --accent: #7aa2ff; --accent-soft: #1f2a44; --ok: #4fd1a5; --ok-soft: #12352a; --bad: #ff8a80; --bad-soft: #3a1714; --mark: #5a4b00; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
  .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
  input[type=search] { width: 100%; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px;
         border: 1px solid var(--line); background: var(--card); color: var(--fg); outline: none; }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filters { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px;
          padding: 4px 12px; font-size: .9rem; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #suggest { list-style: none; margin: 6px 0 0; padding: 0; background: var(--card);
             border: 1px solid var(--line); border-radius: 12px; overflow: hidden; max-height: 70vh; overflow-y: auto; }
  #suggest li { padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  #suggest li:first-child { border-top: 0; }
  #suggest li[aria-selected=true], #suggest li:hover { background: var(--accent-soft); }
  .s-title { font-weight: 600; }
  .s-meta { font-size: .8rem; color: var(--muted); }
  .s-snip { font-size: .88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .task { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .task h2 { margin: 0 0 2px; font-size: 1.25rem; }
  .task .meta { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .task .intro { color: var(--muted); font-size: .9rem; border-left: 3px solid var(--line); padding-left: 10px; margin-bottom: 14px; }
  ol.answers { list-style: none; padding: 0; margin: 0; }
  ol.answers li { padding: 11px 0; border-top: 1px solid var(--line); }
  ol.answers li:first-child { border-top: 0; }
  .q { font-size: .92rem; color: var(--muted); }
  .a { font-weight: 600; color: var(--ok); }
  .fill { font-weight: 600; color: var(--ok); background: var(--ok-soft); border-radius: 4px; padding: 0 3px; }
  .tf { display: inline-block; font-weight: 700; font-size: .85rem; border-radius: 6px; padding: 1px 8px; margin-right: 6px; }
  .tf.T { color: var(--ok); background: var(--ok-soft); }
  .tf.F { color: var(--bad); background: var(--bad-soft); }
  .alt { font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .both { font-size: .78rem; color: var(--muted); font-weight: 400; }
  .empty { color: var(--muted); margin-top: 16px; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Reading &amp; Listening B2 – Lösungen</h1>
  <p class="sub">HTL-Aufgaben von aufgabenpool.at. Tippe den Titel, den ersten Satz oder ein paar Wörter aus einer Frage ein.</p>

  <div class="search">
    <input id="q" type="search" placeholder="z. B. „Beavers returning“ oder „Standing at the edge…“"
           autocomplete="off" autocapitalize="off" spellcheck="false" aria-controls="suggest" autofocus>
    <div class="filters" role="group" aria-label="Fertigkeit">
      <button class="chip" data-skill="" aria-pressed="true">Alle</button>
      <button class="chip" data-skill="Reading" aria-pressed="false">Reading</button>
      <button class="chip" data-skill="Listening" aria-pressed="false">Listening</button>
    </div>
    <ul id="suggest" role="listbox" hidden></ul>
  </div>

  <div id="out"></div>
  <footer id="count"></footer>
</main>

<script src="data.js?v=2"></script>
<script>
(function () {
  const TASKS = window.TASKS || [];
  const $q = document.getElementById('q');
  const $s = document.getElementById('suggest');
  const $out = document.getElementById('out');
  let skill = '', results = [], sel = 0;

  const norm = s => (s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’‘`´]/g, "'").replace(/[“”„]/g, '"')
    .replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const flat = a => Array.isArray(a) ? a.join(' ') : (a || '');

  TASKS.forEach(t => {
    t._title = norm(t.title);
    t._intro = norm(t.intro);
    t._qs = t.answers.map(a => norm(a.q));
    t._all = norm([t.title, t.intro, t.answers.map(a => a.q + ' ' + flat(a.a)).join(' ')].join(' '));
  });

  // returns [score, snippet]
  function score(t, qn, words) {
    if (skill && t.skill !== skill) return [-1];
    if (!qn) return [0, t.intro];
    if (t._title.startsWith(qn)) return [100, t.intro];
    if (t._intro.startsWith(qn)) return [95, t.intro];
    if (t._title.includes(qn)) return [80, t.intro];
    if (t._intro.includes(qn)) return [70, t.intro];
    const qi = t._qs.findIndex(x => x.includes(qn));
    if (qi >= 0) return [60, t.answers[qi].q];
    if (t._all.includes(qn)) return [40, t.intro];
    if (words.length > 1 && words.every(w => t._all.includes(w)))
      return [10 + words.filter(w => t._title.includes(w)).length * 5, t.intro];
    return [-1];
  }

  function highlight(text, qn) {
    const h = esc(text);
    const words = qn.split(' ').filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!words.length) return h;
    return h.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
  }

  function search() {
    const qn = norm($q.value);
    if (!qn) { $s.hidden = true; return; }
    const words = qn.split(' ').filter(Boolean);
    results = TASKS.map(t => { const [s, snip] = score(t, qn, words); return { s, snip, t }; })
      .filter(x => x.s >= 0)
      .sort((a, b) => b.s - a.s || a.t.title.localeCompare(b.t.title));
    sel = 0;
    $s.innerHTML = results.slice(0, 8).map((r, i) =>
      `<li role="option" data-i="${i}" aria-selected="${i === 0}">
         <div class="s-title">${highlight(r.t.title, qn)}</div>
         <div class="s-meta">${r.t.skill} · ${esc(r.t.format)}</div>
         <div class="s-snip">${highlight(r.snip, qn)}</div>
       </li>`).join('') || '<li>Nichts gefunden.</li>';
    $s.hidden = false;
  }

  function renderAnswer(t, a) {
    const ans = Array.isArray(a.a) ? a.a : [a.a];
    const pair = ans.length > 1;
    // TF
    if (a.tf) {
      return `<div class="q">${esc(a.q)}</div>
        <div><span class="tf ${a.tf}">${a.tf === 'T' ? 'True' : 'False'}</span>
        <span class="a">Begründung beginnt mit: „${esc(a.a)}“</span></div>
        ${a.alt ? `<div class="alt">auch akzeptiert: ${a.alt.map(x => '„' + esc(x) + '“').join(', ')}</div>` : ''}`;
    }
    // gap in the question -> fill it in
    if (!pair && a.q && a.q.includes('___')) {
      const i = a.q.indexOf('___');
      const pre = a.q.slice(0, i).trim(), post = a.q.slice(i + 3).trim();
      const punct = /^[.,;:!?”’"]/.test(post);
      const fill = punct ? ans[0].replace(/\.$/, '') : ans[0];
      return `<div class="q">${esc(pre)} <span class="fill">${esc(fill)}</span>${post && !punct ? ' ' : ''}${esc(post)}</div>
        ${a.alt ? `<div class="alt">auch akzeptiert: ${a.alt.map(esc).join(' · ')}</div>` : ''}`;
    }
    return `${a.q ? `<div class="q">${esc(a.q)}</div>` : ''}
      <div class="a">${pair ? ans.map(esc).join('<br>') + ' <span class="both">(beide, Reihenfolge egal)</span>' : esc(ans[0])}</div>
      ${a.alt ? `<div class="alt">auch akzeptiert: ${a.alt.map(esc).join(' · ')}</div>` : ''}`;
  }

  function show(t) {
    $s.hidden = true;
    $out.innerHTML = `<article class="task">
      <h2>${esc(t.title)}</h2>
      <div class="meta">${t.skill} · ${esc(t.format)}</div>
      ${t.intro ? `<div class="intro">${esc(t.intro)}</div>` : ''}
      <ol class="answers">${t.answers.map(a => `<li>${renderAnswer(t, a)}</li>`).join('')}</ol>
    </article>`;
    window.scrollTo({ top: 0 });
    $q.blur();
  }

  function pick(i) { const r = results[i]; if (!r) return; $q.value = r.t.title; show(r.t); }

  $q.addEventListener('input', search);
  $q.addEventListener('focus', () => { if ($q.value) search(); });
  $q.addEventListener('keydown', e => {
    const items = $s.querySelectorAll('li[data-i]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = Math.max(0, Math.min(items.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
      items.forEach((li, i) => li.setAttribute('aria-selected', i === sel));
      if (items[sel]) items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault(); pick(sel);
    } else if (e.key === 'Escape') { $s.hidden = true; }
  });
  $s.addEventListener('click', e => {
    const li = e.target.closest('li[data-i]');
    if (li) pick(+li.dataset.i);
  });
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    skill = b.dataset.skill; search(); $q.focus();
  }));

  const nR = TASKS.filter(t => t.skill === 'Reading').length;
  document.getElementById('count').textContent =
    `${TASKS.length} Aufgaben (${nR} Reading, ${TASKS.length - nR} Listening) · Quelle: aufgabenpool.at (BMBWF)`;
})();
</script>
</body>
</html>
