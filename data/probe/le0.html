<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>403 – Zugriff verweigert</title>
        <style>
            :root {
                --bg: #f8f9fa;
                --fg: #212529;
                --panel: #fff;
                --border: #dee2e6;
                --shadow: rgba(0, 0, 0, 0.06);
                --accent: #c92a2a;
                --muted: #6c757d;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #121212;
                    --fg: #e9ecef;
                    --panel: #1e1e1e;
                    --border: #2c2c2c;
                    --shadow: rgba(0, 0, 0, 0.5);
                    --accent: #ff6b6b;
                    --muted: #adb5bd;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--fg);
                font-family: system-ui, sans-serif;
            }
            .box {
                max-width: 560px;
                padding: 2rem;
                text-align: center;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-shadow: 0 2px 8px var(--shadow);
            }
            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.8rem;
                color: var(--accent);
            }
            p {
                margin: 0.5rem 0 0;
                line-height: 1.5;
            }
            .hint {
                margin-top: 1rem;
                font-size: 0.9rem;
                color: var(--muted);
            }
            .details {
                margin-top: 1.25rem;
                padding: 0.75rem 1rem;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                text-align: left;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.85rem;
                word-break: break-all;
            }
            .details div { margin: 0.15rem 0; }
            .details b { color: var(--muted); font-weight: 600; }
            .actions {
                margin-top: 0.75rem;
                display: flex;
                gap: 0.5rem;
                justify-content: center;
                flex-wrap: wrap;
            }
            button#copyBtn {
                padding: 0.4rem 0.9rem;
                border: 1px solid var(--border);
                background: var(--panel);
                color: var(--fg);
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.85rem;
            }
            button#copyBtn:hover { background: var(--border); }
        </style>
    </head>
    <body>
        <main class="box">
            <h1>403</h1>
            <h2>Zugriff verweigert</h2>
            <p>Diese Anfrage wurde aus Sicherheitsgründen blockiert.</p>
            <p class="hint">
                Falls Sie denken, dass dies ein Fehler war, kontaktieren Sie bitte den
                Seitenbetreiber und teilen Sie ihm die untenstehenden Angaben mit.
            </p>

            <div class="details" id="details">
                <div><b>URL:</b> <span id="url">–</span></div>
                <div><b>Zeitpunkt:</b> <span id="time">–</span></div>
            </div>

            <div class="actions">
                <button id="copyBtn" type="button">Angaben kopieren</button>
            </div>
        </main>

        <script>
            (function () {
                var urlEl = document.getElementById("url");
                var timeEl = document.getElementById("time");
                var btn = document.getElementById("copyBtn");

                var url = window.location.href;
                var now = new Date();
                var timeStr = now.toISOString() + " (lokal: " + now.toString() + ")";

                urlEl.textContent = url;
                timeEl.textContent = timeStr;

                btn.addEventListener("click", function () {
                    var text = "URL: " + url + "\nZeitpunkt: " + timeStr;
                    navigator.clipboard.writeText(text).then(function () {
                        btn.textContent = "Kopiert!";
                        setTimeout(function () { btn.textContent = "Angaben kopieren"; }, 1500);
                    });
                });
            })();
        </script>
    </body>
</html>
